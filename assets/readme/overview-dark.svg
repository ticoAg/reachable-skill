<svg xmlns="http://www.w3.org/2000/svg" id="still" width="720" height="730" viewBox="0 0 720 730" role="img" aria-labelledby="title description">
  <title id="title">signal-codec：解码与编码</title>
  <desc id="description">上方为解码：原始信号经工具处理，得到文本、数值、图表或原生对象。下方为独立的编码方向：按文本、提示、参数、乐谱或数据生成信号。光点从输入沿曲线流向处理节点，再流向输出；仅示意能力关系，不表示流量、性能或验证状态。</desc>
  <style>
    .hub { animation: receive 4.8s cubic-bezier(.77, 0, .175, 1) infinite; }
    .encode-hub { animation-delay: -1.6s; }
    /* The README can select a still view without relying on image media queries. */
    #still:target .motion { display: none; }
    #still:target .hub { animation: none; }
    @keyframes receive {
      0%, 30%, 80%, 100% { opacity: .68; }
      46%, 58% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
      .hub { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="background" x2="0" y2="1">
      <stop stop-color="#19231F"/>
      <stop offset="1" stop-color="#201F1A"/>
    </linearGradient>
    <linearGradient id="decode" gradientUnits="userSpaceOnUse" x1="225" x2="494">
      <stop stop-color="#84D9B7" stop-opacity=".24"/>
      <stop offset=".5" stop-color="#84D9B7" stop-opacity=".50"/>
      <stop offset="1" stop-color="#84D9B7" stop-opacity=".24"/>
    </linearGradient>
    <linearGradient id="encode" gradientUnits="userSpaceOnUse" x1="225" x2="494">
      <stop stop-color="#F0B488" stop-opacity=".24"/>
      <stop offset=".5" stop-color="#F0B488" stop-opacity=".50"/>
      <stop offset="1" stop-color="#F0B488" stop-opacity=".24"/>
    </linearGradient>
    <g id="packet">
